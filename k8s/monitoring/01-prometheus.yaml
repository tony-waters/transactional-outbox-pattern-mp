# Prometheus, adapted from Strimzi's bundled example
# (examples/metrics/prometheus-install/prometheus.yaml in strimzi-kafka-operator, tag 1.2.0):
# same RBAC + Prometheus CR shape, retargeted at the `monitoring` namespace, with the
# alerting/ruleSelector/additionalScrapeConfigs fields dropped since alerting is out of scope
# for this phase (see #16).
#
# Requires the Prometheus Operator (CRDs + controller) to already be installed — see README.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-server
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - extensions
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-server
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-server
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
spec:
  image: quay.io/prometheus/prometheus:v3.14.0
  replicas: 1
  serviceAccountName: prometheus-server
  # Single-tenant demo cluster: no need for label-based selection, so watch every PodMonitor/
  # ServiceMonitor in every namespace rather than requiring a matching label.
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  # Lets Tempo's metrics-generator remote_write service-graph/span-metrics samples in
  # (see k8s/monitoring/03-tempo.yaml) instead of Prometheus only ever scraping outward.
  enableRemoteWriteReceiver: true
  resources:
    requests:
      memory: 400Mi
---
# Scrapes the Kafka brokers, Kafka Connect, and the kafka_exporter sidecar (consumer-group
# lag) — all three carry `strimzi.io/kind` and expose Strimzi's standard tcp-prometheus port
# (9404), which Strimzi opens to all namespaces by default (see k8s/02-kafka.yaml,
# k8s/03-kafka-connect.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchExpressions:
      - key: "strimzi.io/kind"
        operator: In
        values: ["Kafka", "KafkaConnect", "KafkaMirrorMaker2"]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod_name
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
---
# Scrapes rest-service and email-service's Micrometer/Actuator Prometheus endpoint.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: outbox-services-metrics
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: ["rest-service", "email-service"]
  podMetricsEndpoints:
    - path: /actuator/prometheus
      port: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod_name
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
