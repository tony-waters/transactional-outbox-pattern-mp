# kafka-ui on Kind: single instance, NodePort, pointed at Strimzi's bootstrap Service and the
# KafkaConnect cluster's REST API (see #13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: outbox-kafka-bootstrap:9092
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME
              value: connect
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS
              value: http://outbox-connect-connect-api:8083
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Strimzi's auto-generated NetworkPolicy on the Connect pod only admits ingress from Connect's
# own pods and the cluster operator (port 8083), which blocks kafka-ui's connector-status calls.
# NetworkPolicies selecting the same pod are additive, so this only adds an allowance rather
# than replacing Strimzi's managed policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ui-to-connect
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: outbox-connect
      strimzi.io/kind: KafkaConnect
      strimzi.io/name: outbox-connect-connect
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka-ui
      ports:
        - port: 8083
          protocol: TCP
